name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Create Project
        run: |
          cordova create app com.dudhdudu.securevault "Secure Vault Pro"
          cp index.html app/www/index.html
          cp config.xml app/config.xml
      
      - name: Add iOS
        run: |
          cd app
          cordova platform add ios
      
      - name: Add Plugins
        run: |
          cd app
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-network-information
          cordova plugin add cordova-plugin-geolocation
      
      - name: Build for Device
        run: |
          cd app
          cordova build ios --release --device --buildFlag="-UseModernBuildSystem=0"
      
      - name: Find and Upload
        run: |
          mkdir -p output
          find app/platforms/ios/build -name "*.app" -exec cp -r {} output/ \; 2>/dev/null || true
          find app/platforms/ios/build -name "*.ipa" -exec cp {} output/ \; 2>/dev/null || true
          ls -la output/
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SecureVaultPro
          path: output/
          if-no-files-found: warn
