name: Build IPA VIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Dependencies
        run: |
          npm install -g cordova
          npm install -g ios-deploy
          gem install cocoapods
      
      - name: Create Project
        run: |
          cordova create app com.dudhdudu.securevault "Secure Vault Pro"
          cp index.html app/www/index.html
          cp config.xml app/config.xml
          cd app
          cordova platform add ios
          cordova plugin add cordova-plugin-device
          cordova plugin add cordova-plugin-network-information
          cordova plugin add cordova-plugin-geolocation
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-media
          cordova plugin add cordova-plugin-contacts
          cordova plugin add cordova-plugin-dialogs
          cordova plugin add cordova-plugin-vibration
      
      - name: Build VIP
        run: |
          cd app
          cordova build ios --release --device --buildFlag="-UseModernBuildSystem=0"
          cd platforms/ios
          xcodebuild -workspace "Secure Vault Pro.xcworkspace" -scheme "Secure Vault Pro" -configuration Release -sdk iphoneos archive -archivePath "SecureVaultPro.xcarchive"
          xcodebuild -exportArchive -archivePath "SecureVaultPro.xcarchive" -exportPath "export" -exportOptionsPlist exportOptions.plist
      
      - name: Create Export Plist
        run: |
          cat > app/platforms/ios/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SecureVaultPro
          path: app/platforms/ios/export/*.ipa
          if-no-files-found: warn
      
      - name: Upload App (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: SecureVaultApp
          path: app/platforms/ios/build/device/*.app
          if-no-files-found: warn
