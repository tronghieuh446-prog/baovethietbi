name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Build App
        run: |
          cordova create app com.dudhdudu.securevault "SecureVault"
          cp index.html app/www/index.html
          cp config.xml app/config.xml
          cd app
          cordova platform add ios
          cordova build ios --emulator
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SecureVault
          path: app/platforms/ios/build/emulator/*.app
